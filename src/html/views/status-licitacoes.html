      <!-- ===================== STATUS LICITAÇÕES ===================== -->
      <section id="view-statusLicitacoes" class="view">
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="sl.title">📋 Status Licitações</h2>
            <div class="btn-row" style="margin:0">
              <button type="button" class="btn btn-ghost btn-sm" id="btnSlSortNome" title="Ordenar A–Z pelo nome da licitação">A–Z</button>
              <button type="button" class="btn btn-ghost btn-sm" id="btnSlSortData" title="Ordenar por data">Por data</button>
              <button type="button" class="btn btn-gold btn-sm" id="btnSlAdd">+ Nova linha</button>
            </div>
          </div>
          <div class="desc" data-i18n="sl.desc">
            Acompanhe cada licitação: orçada, cadastrada e o status do processo. Clique no V verde (ok) ou no X vermelho. Escolha o status na lista.
          </div>
          <div id="slAlert" class="alert"></div>

          <div class="sl-add">
            <div class="sl-add-grid">
              <label class="fld" for="slNewData">Data
                <input type="date" id="slNewData" />
              </label>
              <label class="fld" for="slNewNome">Licitação
                <input type="text" id="slNewNome" placeholder="ex.: Pref. Ibaiti — Materiais elétricos" autocomplete="off" />
              </label>
              <label class="fld" for="slNewMunicipio">Município
                <input type="text" id="slNewMunicipio" placeholder="ex.: Ibaiti" autocomplete="off" />
              </label>
              <div class="sl-add-actions">
                <button type="button" class="btn btn-gold" id="btnSlAddConfirm">Adicionar</button>
              </div>
            </div>
          </div>

          <div class="tbl-wrap sl-wrap">
            <table id="slTable" class="sl-table">
              <thead>
                <tr>
                  <th class="sl-th-sort" data-sl-sort="data">DATA</th>
                  <th class="sl-th-sort" data-sl-sort="nome">LICITAÇÃO</th>
                  <th class="sl-th-sort" data-sl-sort="municipio">MUNICÍPIO</th>
                  <th class="sl-th-center">ORÇADA</th>
                  <th class="sl-th-center">CADASTRADA</th>
                  <th>STATUS</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="slBody"></tbody>
            </table>
          </div>
        </div>
      </section>
