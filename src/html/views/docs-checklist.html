      <!-- ===================== DOCS CHECKLIST (edital) ===================== -->
      <section id="view-docsChecklist" class="view">
        <div class="card">
          <div class="card-head">
            <h2>✅ Documentos do Edital</h2>
            <div class="btn-row" style="margin:0">
              <button type="button" class="btn btn-ghost btn-sm" id="btnDocsAdd">+ Documento</button>
              <button type="button" class="btn btn-ghost btn-sm" id="btnDocsClearOk">Limpar OKs</button>
              <button type="button" class="btn btn-primary btn-sm" id="btnDocsSalvar">💾 Salvar</button>
            </div>
          </div>
          <div class="desc">
            Checklist dos documentos exigidos na análise do edital. Marque <b>OK</b> nos que você já possui.
            Quando possível, o sistema sugere correspondência com o <b>Cofre de Documentos</b>.
          </div>
          <div id="docsAlert" class="alert"></div>
          <div id="docsMeta" class="docs-meta" style="display:none"></div>
          <div id="docsSummary" class="docs-summary"></div>
          <div id="docsList" class="docs-list">
            <div class="muted small">Nenhum checklist ainda. Rode a <b>Análise IA</b> em um edital para gerar a lista.</div>
          </div>
        </div>
      </section>
